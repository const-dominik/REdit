{% load static %}

<script>
    const initializeDetailedCharts = () => {
        const initializePieChart = (ctx, labels, values, tooltipLabel) => {
            new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: labels,
                    datasets: [{
                        label: tooltipLabel,
                        data: values,
                        backgroundColor: [
                            'rgba(255, 99, 132, 0.6)',
                            'rgba(54, 162, 235, 0.6)',
                            'rgba(255, 206, 86, 0.6)',
                            'rgba(75, 192, 192, 0.6)',
                            'rgba(153, 102, 255, 0.6)',
                            'rgba(255, 159, 64, 0.6)'
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                font: { size: 10 },
                                padding: 8,
                                boxWidth: 12
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: (context) => `${context.label}: ${context.raw.toFixed(2)} ${tooltipLabel}`
                            }
                        }
                    },
                    layout: {
                        padding: {
                            top: 10
                        }
                    }
                }
            });
        }

        const initializeStackedBarChart = (ctx, labels, datasets) => {
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                font: { size: 10 },
                                padding: 8,
                                boxWidth: 12
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: (context) => {
                                    const label = context.dataset.label || '';
                                    const value = context.raw.toFixed(2);
                                    return `${label}: ${value}`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            stacked: true,
                            grid: { display: false },
                            title: { display: true, text: 'Category' }
                        },
                        y: {
                            stacked: true,
                            beginAtZero: true,
                            grid: { color: 'rgba(0, 0, 0, 0.1)' },
                            title: { display: true, text: 'Average Engagement' }
                        }
                    }
                }
            });
        }

        // Initialize all pie charts
        const viewsDistributionChartCtx = document.getElementById('viewsDistributionChart').getContext('2d');
        initializePieChart(viewsDistributionChartCtx, {{ yt.detailed_analytics.views_by_content_group.labels|safe }}, {{ yt.detailed_analytics.views_by_content_group.values|safe }}, 'avg views');

        const avgViewsPerVideoTypeCtx = document.getElementById('avgViewsPerVideoTypeChart').getContext('2d');
        initializePieChart(avgViewsPerVideoTypeCtx, {{ yt.detailed_analytics.views_by_video_type.labels|safe }}, {{ yt.detailed_analytics.views_by_video_type.values|safe }}, 'avg views');

        const avgViewsPerSongTypeCtx = document.getElementById('avgViewsPerSongTypeChart').getContext('2d');
        initializePieChart(avgViewsPerSongTypeCtx, {{ yt.detailed_analytics.views_by_song_type.labels|safe }}, {{ yt.detailed_analytics.views_by_song_type.values|safe }}, 'avg views');

        const avgViewsPerSongTitleCtx = document.getElementById('avgViewsPerSongTitleChart').getContext('2d');
        initializePieChart(avgViewsPerSongTitleCtx, {{ yt.detailed_analytics.views_by_song_title.labels|safe }}, {{ yt.detailed_analytics.views_by_song_title.values|safe }}, 'avg views');

        const avgViewsPerBackgroundCtx = document.getElementById('avgViewsPerBackgroundChart').getContext('2d');
        initializePieChart(avgViewsPerBackgroundCtx, {{ yt.detailed_analytics.views_by_background.labels|safe }}, {{ yt.detailed_analytics.views_by_background.values|safe }}, 'avg views');

        const avgViewsPerMediaPerScreenCtx = document.getElementById('avgViewsPerMediaPerScreenChart').getContext('2d');
        initializePieChart(avgViewsPerMediaPerScreenCtx, {{ yt.detailed_analytics.views_by_media_per_screen.labels|safe }}, {{ yt.detailed_analytics.views_by_media_per_screen.values|safe }}, 'avg views');

        const avgViewsPerMediaQtyCtx = document.getElementById('avgViewsPerMediaQtyChart').getContext('2d');
        initializePieChart(avgViewsPerMediaQtyCtx, {{ yt.detailed_analytics.views_by_media_qty.labels|safe }}, {{ yt.detailed_analytics.views_by_media_qty.values|safe }}, 'avg views');

        const avgViewsStartTextCtx = document.getElementById('avgViewsStartTextChart').getContext('2d');
        initializePieChart(avgViewsStartTextCtx, {{ yt.detailed_analytics.views_by_start_text.labels|safe }}, {{ yt.detailed_analytics.views_by_start_text.values|safe }}, 'avg views');

        const avgViewsEndTextCtx = document.getElementById('avgViewsEndTextChart').getContext('2d');
        initializePieChart(avgViewsEndTextCtx, {{ yt.detailed_analytics.views_by_end_text.labels|safe }}, {{ yt.detailed_analytics.views_by_end_text.values|safe }}, 'avg views');

        

        const engagementRateByContentGroupCtx = document.getElementById('engagementRateByContentGroupChart').getContext('2d');
        initializeStackedBarChart(engagementRateByContentGroupCtx , {{ yt.detailed_analytics.engagement_by_content_group.labels|safe }}, {{ yt.detailed_analytics.engagement_by_content_group.datasets|safe }});

        const engagementPerVideoTypeCtx = document.getElementById('engagementPerVideoTypeChart').getContext('2d');
        initializeStackedBarChart(engagementPerVideoTypeCtx, {{ yt.detailed_analytics.engagement_by_video_type.labels|safe }}, {{ yt.detailed_analytics.engagement_by_video_type.datasets|safe }});

        const engagementPerSongTypeCtx = document.getElementById('engagementPerSongTypeChart').getContext('2d');
        initializeStackedBarChart(engagementPerSongTypeCtx, {{ yt.detailed_analytics.engagement_by_song_type.labels|safe }}, {{ yt.detailed_analytics.engagement_by_song_type.datasets|safe }});

        const engagementPerSongTitleCtx = document.getElementById('engagementPerSongTitleChart').getContext('2d');
        initializeStackedBarChart(engagementPerSongTitleCtx, {{ yt.detailed_analytics.engagement_by_song_title.labels|safe }}, {{ yt.detailed_analytics.engagement_by_song_title.datasets|safe }});

        const engagementPerBackgroundCtx = document.getElementById('engagementPerBackgroundChart').getContext('2d');
        initializeStackedBarChart(engagementPerBackgroundCtx, {{ yt.detailed_analytics.engagement_by_background.labels|safe }}, {{ yt.detailed_analytics.engagement_by_background.datasets|safe }});

        const engagementPerMediaPerScreenCtx = document.getElementById('engagementPerMediaPerScreenChart').getContext('2d');
        initializeStackedBarChart(engagementPerMediaPerScreenCtx, {{ yt.detailed_analytics.engagement_by_media_per_screen.labels|safe }}, {{ yt.detailed_analytics.engagement_by_media_per_screen.datasets|safe }});

        const engagementPerMediaQtyCtx = document.getElementById('engagementPerMediaQtyChart').getContext('2d');
        initializeStackedBarChart(engagementPerMediaQtyCtx, {{ yt.detailed_analytics.engagement_by_media_qty.labels|safe }}, {{ yt.detailed_analytics.engagement_by_media_qty.datasets|safe }});

        const engagementPerStartTextCtx = document.getElementById('engagementPerStartTextChart').getContext('2d');
        initializeStackedBarChart(engagementPerStartTextCtx, {{ yt.detailed_analytics.engagement_by_start_text.labels|safe }}, {{ yt.detailed_analytics.engagement_by_start_text.datasets|safe }});

        const engagementPerEndTextCtx = document.getElementById('engagementPerEndTextChart').getContext('2d');
        initializeStackedBarChart(engagementPerEndTextCtx, {{ yt.detailed_analytics.engagement_by_end_text.labels|safe }}, {{ yt.detailed_analytics.engagement_by_end_text.datasets|safe }});

        const avgWatchPercentagePerContentGroupCtx = document.getElementById('avgWatchPercentagePerContentGroupChart').getContext('2d');
        initializePieChart(avgWatchPercentagePerContentGroupCtx, {{ yt.detailed_analytics.watch_percentage_by_content_group.labels|safe }}, {{ yt.detailed_analytics.watch_percentage_by_content_group.values|safe }}, 'avg watch %');

        const avgWatchPercentagePerVideoTypeCtx = document.getElementById('avgWatchPercentagePerVideoTypeChart').getContext('2d');
        initializePieChart(avgWatchPercentagePerVideoTypeCtx, {{ yt.detailed_analytics.watch_percentage_by_video_type.labels|safe }}, {{ yt.detailed_analytics.watch_percentage_by_video_type.values|safe }}, 'avg watch %');

        const avgWatchPercentagePerSongTypeCtx = document.getElementById('avgWatchPercentagePerSongTypeChart').getContext('2d');
        initializePieChart(avgWatchPercentagePerSongTypeCtx, {{ yt.detailed_analytics.watch_percentage_by_song_type.labels|safe }}, {{ yt.detailed_analytics.watch_percentage_by_song_type.values|safe }}, 'avg watch %');

        const avgWatchPercentagePerSongTitleCtx = document.getElementById('avgWatchPercentagePerSongTitleChart').getContext('2d');
        initializePieChart(avgWatchPercentagePerSongTitleCtx, {{ yt.detailed_analytics.watch_percentage_by_song_title.labels|safe }}, {{ yt.detailed_analytics.watch_percentage_by_song_title.values|safe }}, 'avg watch %');

        const avgWatchPercentagePerBackgroundCtx = document.getElementById('avgWatchPercentagePerBackgroundChart').getContext('2d');
        initializePieChart(avgWatchPercentagePerBackgroundCtx, {{ yt.detailed_analytics.watch_percentage_by_background.labels|safe }}, {{ yt.detailed_analytics.watch_percentage_by_background.values|safe }}, 'avg watch %');

        const avgWatchPercentagePerMediaPerScreenCtx = document.getElementById('avgWatchPercentagePerMediaPerScreenChart').getContext('2d');
        initializePieChart(avgWatchPercentagePerMediaPerScreenCtx, {{ yt.detailed_analytics.watch_percentage_by_media_per_screen.labels|safe }}, {{ yt.detailed_analytics.watch_percentage_by_media_per_screen.values|safe }}, 'avg watch %');

        const avgWatchPercentagePerMediaQtyCtx = document.getElementById('avgWatchPercentagePerMediaQtyChart').getContext('2d');
        initializePieChart(avgWatchPercentagePerMediaQtyCtx, {{ yt.detailed_analytics.watch_percentage_by_media_qty.labels|safe }}, {{ yt.detailed_analytics.watch_percentage_by_media_qty.values|safe }}, 'avg watch %');

        const avgWatchPercentagePerStartTextCtx = document.getElementById('avgWatchPercentagePerStartTextChart').getContext('2d');
        initializePieChart(avgWatchPercentagePerStartTextCtx, {{ yt.detailed_analytics.watch_percentage_by_start_text.labels|safe }}, {{ yt.detailed_analytics.watch_percentage_by_start_text.values|safe }}, 'avg watch %');

        const avgWatchPercentagePerEndTextCtx = document.getElementById('avgWatchPercentagePerEndTextChart').getContext('2d');
        initializePieChart(avgWatchPercentagePerEndTextCtx, {{ yt.detailed_analytics.watch_percentage_by_end_text.labels|safe }}, {{ yt.detailed_analytics.watch_percentage_by_end_text.values|safe }}, 'avg watch %');

        const videoLengthVsViewMetricsCtx = document.getElementById('videoLengthVsViewMetricsChart').getContext('2d');
        const videoLengthVsViewMetricsData = {{ yt.detailed_analytics.video_length_vs_metrics|safe }}

        const datasets = [
            {
                label: 'Video Length vs. Average View Percentage',
                data: videoLengthVsViewMetricsData.video_lengths.map((length, index) => ({
                    x: length,
                    y: videoLengthVsViewMetricsData.avg_view_percentages[index]
                })),
                backgroundColor: 'rgba(255, 99, 132, 0.6)',
                borderColor: 'rgba(255, 99, 132, 1)',
                borderWidth: 1
            },
            {
                label: 'Video Length vs. Average View Duration',
                data: videoLengthVsViewMetricsData.video_lengths.map((length, index) => ({
                    x: length,
                    y: videoLengthVsViewMetricsData.avg_view_durations[index]
                })),
                backgroundColor: 'rgba(54, 162, 235, 0.6)',
                borderColor: 'rgba(54, 162, 235, 1)',
                borderWidth: 1
            }
        ];

        // Initialize the chart
        new Chart(videoLengthVsViewMetricsCtx, {
            type: 'scatter',
            data: {
                datasets: datasets
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            font: { size: 10 },
                            padding: 8,
                            boxWidth: 12
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label: (context) => {
                                const datasetLabel = context.dataset.label || '';
                                const x = context.raw.x.toFixed(2);
                                const y = context.raw.y.toFixed(2);
                                return `${datasetLabel}: (${x}, ${y})`;
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        type: 'linear',
                        position: 'bottom',
                        title: {
                            display: true,
                            text: 'Video Length (seconds)'
                        }
                    },
                    y: {
                        title: {
                            display: true,
                            text: 'Average View Percentage/Duration'
                        }
                    }
                }
            }
        });

        const avgViewsPerShortsPostedCtx = document.getElementById('avgViewsPerShortsPostedChart').getContext('2d');
        initializePieChart(avgViewsPerShortsPostedCtx, {{ yt.detailed_analytics.views_per_posting_frequency.labels|safe }}, {{ yt.detailed_analytics.views_per_posting_frequency.values|safe }}, 'avg views');

        const avgViewsPerDayOfWeekCtx = document.getElementById('avgViewsPerDayOfWeekChart').getContext('2d');
        new Chart(avgViewsPerDayOfWeekCtx, {
            type: 'bar',
            data: {
                labels: {{ yt.detailed_analytics.views_per_day_of_week.labels|safe }},
                datasets: [{
                    label: 'Average Views',
                    data: {{ yt.detailed_analytics.views_per_day_of_week.values|safe }},
                    backgroundColor: 'rgba(153, 102, 255, 0.6)',
                    borderColor: 'rgba(153, 102, 255, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    },
                    tooltip: {
                        callbacks: {
                            label: (context) => `${context.label}: ${context.raw.toFixed(2)} avg views`
                        }
                    }
                },
                scales: {
                    x: {
                        title: {
                            display: true,
                            text: 'Day of the Week'
                        },
                        grid: { display: false }
                    },
                    y: {
                        title: {
                            display: true,
                            text: 'Average Views'
                        },
                        beginAtZero: true,
                        grid: { color: 'rgba(0, 0, 0, 0.1)' }
                    }
                }
            }
        });
}
</script>
