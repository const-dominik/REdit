{% load static %}

<script>
    const initializeDetailedReelsCharts = () => {
        const initializePieChart = (ctx, labels, values, tooltipLabel) => {
            new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: labels,
                    datasets: [{
                        label: tooltipLabel,
                        data: values,
                        backgroundColor: [
                            'rgba(255, 99, 132, 0.6)',
                            'rgba(54, 162, 235, 0.6)',
                            'rgba(255, 206, 86, 0.6)',
                            'rgba(75, 192, 192, 0.6)',
                            'rgba(153, 102, 255, 0.6)',
                            'rgba(255, 159, 64, 0.6)'
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                font: { size: 10 },
                                padding: 8,
                                boxWidth: 12
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: (context) => `${context.label}: ${context.raw.toFixed(2)} ${tooltipLabel}`
                            }
                        }
                    },
                    layout: {
                        padding: {
                            top: 10
                        }
                    }
                }
            });
        }
    
        const initializeStackedBarChart = (ctx, labels, datasets) => {
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                font: { size: 10 },
                                padding: 8,
                                boxWidth: 12
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: (context) => {
                                    const datasetLabel = context.dataset.label || '';
                                    const value = context.raw.toFixed(2);
                                    return `${datasetLabel}: ${value}`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            stacked: true,
                            title: {
                                display: true,
                                text: 'Category'
                            },
                            grid: { display: false }
                        },
                        y: {
                            stacked: true,
                            title: {
                                display: true,
                                text: 'Average Engagement'
                            },
                            beginAtZero: true,
                            grid: { color: 'rgba(0, 0, 0, 0.1)' }
                        }
                    }
                }
            });
        }
        
    
        const instagramAvgViewsPerContentGroupCtx = document.getElementById('instagramAvgViewsPerContentGroupChart').getContext('2d');
        initializePieChart(instagramAvgViewsPerContentGroupCtx, {{ ig.detailed_analytics.views_by_content_group.labels|safe }}, {{ ig.detailed_analytics.views_by_content_group.values|safe }}, 'avg views');
    
        const instagramAvgViewsPerVideoTypeCtx = document.getElementById('instagramAvgViewsPerVideoTypeChart').getContext('2d');
        initializePieChart(instagramAvgViewsPerVideoTypeCtx, {{ ig.detailed_analytics.views_by_video_type.labels|safe }}, {{ ig.detailed_analytics.views_by_video_type.values|safe }}, 'avg views');
    
        const instagramAvgViewsPerSongTypeCtx = document.getElementById('instagramAvgViewsPerSongTypeChart').getContext('2d');
        initializePieChart(instagramAvgViewsPerSongTypeCtx, {{ ig.detailed_analytics.views_by_song_type.labels|safe }}, {{ ig.detailed_analytics.views_by_song_type.values|safe }}, 'avg views');
    
        const instagramAvgViewsPerSongTitleCtx = document.getElementById('instagramAvgViewsPerSongTitleChart').getContext('2d');

        const instagramAvgViewsPerBackgroundCtx = document.getElementById('instagramAvgViewsPerBackgroundChart').getContext('2d');

        const instagramAvgViewsPerMediaPerScreenCtx = document.getElementById('instagramAvgViewsPerMediaPerScreenChart').getContext('2d');
        initializePieChart(instagramAvgViewsPerMediaPerScreenCtx, {{ ig.detailed_analytics.views_by_media_per_screen.labels|safe }}, {{ ig.detailed_analytics.views_by_media_per_screen.values|safe }}, 'avg views');

        const instagramAvgViewsPerStartTextCtx = document.getElementById('instagramAvgViewsPerStartTextChart').getContext('2d');

        const instagramAvgViewsPerEndTextCtx = document.getElementById('instagramAvgViewsPerEndTextChart').getContext('2d');

        const instagramEngagementRateByContentGroupCtx = document.getElementById('instagramEngagementRateByContentGroupChart').getContext('2d');
        initializeStackedBarChart(instagramEngagementRateByContentGroupCtx, {{ ig.detailed_analytics.engagement_by_content_group.labels|safe }}, {{ ig.detailed_analytics.engagement_by_content_group.datasets|safe }});
    
        const instagramEngagementPerVideoTypeCtx = document.getElementById('instagramEngagementPerVideoTypeChart').getContext('2d');
        initializeStackedBarChart(instagramEngagementPerVideoTypeCtx, {{ ig.detailed_analytics.engagement_by_video_type.labels|safe }}, {{ ig.detailed_analytics.engagement_by_video_type.datasets|safe }});
    
        const instagramEngagementPerSongTypeCtx = document.getElementById('instagramEngagementPerSongTypeChart').getContext('2d');

        const instagramEngagementPerSongTitleCtx = document.getElementById('instagramEngagementPerSongTitleChart').getContext('2d');

        const instagramEngagementPerBackgroundCtx = document.getElementById('instagramEngagementPerBackgroundChart').getContext('2d');
        initializeStackedBarChart(instagramEngagementPerBackgroundCtx, {{ ig.detailed_analytics.engagement_by_background.labels|safe }}, {{ ig.detailed_analytics.engagement_by_background.datasets|safe }});
    
        const instagramEngagementPerMediaPerScreenCtx = document.getElementById('instagramEngagementPerMediaPerScreenChart').getContext('2d');
        initializeStackedBarChart(instagramEngagementPerMediaPerScreenCtx, {{ ig.detailed_analytics.engagement_by_media_per_screen.labels|safe }}, {{ ig.detailed_analytics.engagement_by_media_per_screen.datasets|safe }});
    
        const instagramEngagementPerMediaQtyCtx = document.getElementById('instagramEngagementPerMediaQtyChart').getContext('2d');
        initializeStackedBarChart(instagramEngagementPerMediaQtyCtx, {{ ig.detailed_analytics.engagement_by_media_qty.labels|safe }}, {{ ig.detailed_analytics.engagement_by_media_qty.datasets|safe }});
    
        const instagramEngagementPerStartTextCtx = document.getElementById('instagramEngagementPerStartTextChart').getContext('2d');
        initializeStackedBarChart(instagramEngagementPerStartTextCtx, {{ ig.detailed_analytics.engagement_by_start_text.labels|safe }}, {{ ig.detailed_analytics.engagement_by_start_text.datasets|safe }});
    
        const instagramEngagementPerEndTextCtx = document.getElementById('instagramEngagementPerEndTextChart').getContext('2d');
        initializeStackedBarChart(instagramEngagementPerEndTextCtx, {{ ig.detailed_analytics.engagement_by_end_text.labels|safe }}, {{ ig.detailed_analytics.engagement_by_end_text.datasets|safe }});
    
        // Initialize Instagram Watch Percentage Charts
        const instagramAvgWatchPercentageContentGroupCtx = document.getElementById('instagramAvgWatchPercentagePerContentGroupChart').getContext('2d');
        initializePieChart(instagramAvgWatchPercentageContentGroupCtx, {{ ig.detailed_analytics.watch_percentage_by_content_group.labels|safe }}, {{ ig.detailed_analytics.watch_percentage_by_content_group.values|safe }}, 'avg watch %');
    
        const instagramAvgWatchPercentageVideoTypeCtx = document.getElementById('instagramAvgWatchPercentagePerVideoTypeChart').getContext('2d');
        initializePieChart(instagramAvgWatchPercentageVideoTypeCtx, {{ ig.detailed_analytics.watch_percentage_by_video_type.labels|safe }}, {{ ig.detailed_analytics.watch_percentage_by_video_type.values|safe }}, 'avg watch %');
    
        const instagramAvgWatchPercentageSongTypeCtx = document.getElementById('instagramAvgWatchPercentagePerSongTypeChart').getContext('2d');
        initializePieChart(instagramAvgWatchPercentageSongTypeCtx, {{ ig.detailed_analytics.watch_percentage_by_song_type.labels|safe }}, {{ ig.detailed_analytics.watch_percentage_by_song_type.values|safe }}, 'avg watch %');
    
        const instagramAvgWatchPercentageSongTitleCtx = document.getElementById('instagramAvgWatchPercentagePerSongTitleChart').getContext('2d');
        initializePieChart(instagramAvgWatchPercentageSongTitleCtx, {{ ig.detailed_analytics.watch_percentage_by_song_title.labels|safe }}, {{ ig.detailed_analytics.watch_percentage_by_song_title.values|safe }}, 'avg watch %');
    
        const instagramAvgWatchPercentageBackgroundCtx = document.getElementById('instagramAvgWatchPercentagePerBackgroundChart').getContext('2d');
        initializePieChart(instagramAvgWatchPercentageBackgroundCtx, {{ ig.detailed_analytics.watch_percentage_by_background.labels|safe }}, {{ ig.detailed_analytics.watch_percentage_by_background.values|safe }}, 'avg watch %');
    
        const instagramAvgWatchPercentageMediaPerScreenCtx = document.getElementById('instagramAvgWatchPercentagePerMediaPerScreenChart').getContext('2d');
        initializePieChart(instagramAvgWatchPercentageMediaPerScreenCtx, {{ ig.detailed_analytics.watch_percentage_by_media_per_screen.labels|safe }}, {{ ig.detailed_analytics.watch_percentage_by_media_per_screen.values|safe }}, 'avg watch %');
    
        const instagramAvgWatchPercentageMediaQtyCtx = document.getElementById('instagramAvgWatchPercentagePerMediaQtyChart').getContext('2d');
        initializePieChart(instagramAvgWatchPercentageMediaQtyCtx, {{ ig.detailed_analytics.watch_percentage_by_media_qty.labels|safe }}, {{ ig.detailed_analytics.watch_percentage_by_media_qty.values|safe }}, 'avg watch %');
    
        const instagramAvgWatchPercentageStartTextCtx = document.getElementById('instagramAvgWatchPercentagePerStartTextChart').getContext('2d');
        initializePieChart(instagramAvgWatchPercentageStartTextCtx, {{ ig.detailed_analytics.watch_percentage_by_start_text.labels|safe }}, {{ ig.detailed_analytics.watch_percentage_by_start_text.values|safe }}, 'avg watch %');
    
        const instagramAvgWatchPercentageEndTextCtx = document.getElementById('instagramAvgWatchPercentagePerEndTextChart').getContext('2d');
        initializePieChart(instagramAvgWatchPercentageEndTextCtx, {{ ig.detailed_analytics.watch_percentage_by_end_text.labels|safe }}, {{ ig.detailed_analytics.watch_percentage_by_end_text.values|safe }}, 'avg watch %');
        
        
        // Instagram Section 4 Charts
    // Scatter Plot: Video Length vs Watch Time
    const instagramScatterCtx = document.getElementById('instagramVideoLengthVsWatchTimeChart').getContext('2d');
    new Chart(instagramScatterCtx, {
        type: 'scatter',
        data: {
            datasets: [{
                label: 'Video Length vs Watch Time',
                data: {{ ig.detailed_analytics.video_length_vs_watch_time|safe }},
                backgroundColor: 'rgba(255, 99, 132, 0.5)'
            }]
        },
        options: {
            scales: {
                x: {
                    title: { display: true, text: 'Video Length (seconds)' }
                },
                y: {
                    title: { display: true, text: 'Avg Watch Time (seconds)' }
                }
            }
        }
    });

    const instagramDailyPostsPieCtx = document.getElementById('instagramAvgViewsPerDailyPostsPieChart').getContext('2d');
    initializePieChart(
        instagramDailyPostsPieCtx,
        {{ ig.detailed_analytics.views_per_posting_frequency.labels|safe }},
        {{ ig.detailed_analytics.views_per_posting_frequency.values|safe }},
        'Views'
    );
    
    // BAR Chart: Views per Day of Week
    const instagramViewsDoWBarCtx = document.getElementById('instagramViewsPerDayOfWeekBarChart').getContext('2d');
    initializePieChart(
        instagramViewsDoWBarCtx,
        {{ ig.detailed_analytics.views_per_day_of_week.labels|safe }},
        {{ ig.detailed_analytics.views_per_day_of_week.values|safe }},
        'Average Views'
    );
    }
</script>
